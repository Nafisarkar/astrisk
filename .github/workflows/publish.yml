name: publish

# Tag-driven. The Visual Studio Marketplace job carries no secret: it exchanges
# a short-lived GitHub OIDC token for a publishing credential (trusted
# publishing). Open VSX has no such exchange for this account, so it reads a
# personal access token from the OVSX_PAT secret and skips when it is absent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run compile
      - run: bun test
      - name: the vsix must build before it is published
        run: bun x @vscode/vsce package --out /tmp/asterisk.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: /tmp/asterisk.vsix

  marketplace:
    needs: verify
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - name: publish the pre-release channel
        run: npx --yes @vscode/vsce publish --oidc --pre-release --skip-duplicate

  openvsx:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      # ovsx packs the extension itself here, because --pre-release only applies
      # while packing; handing it a finished .vsix would silently drop the flag.
      - name: publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, skipping Open VSX"
            exit 0
          fi
          npx --yes ovsx@1.4.0 publish -p "$OVSX_PAT" --pre-release --skip-duplicate
